name: fork-probe
on: [pull_request]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Write token probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "repo=${{ github.repository }}"
          gh api "repos/${{ github.repository }}" --jq '.permissions' || echo REPO_API_FAILED
          gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/heads/probe-${{ github.run_id }}" -f sha="${{ github.sha }}" && echo CREATE_REF_OK || echo CREATE_REF_FAILED
          gh api -X POST "repos/${{ github.repository }}/issues" -f title="probe write" -f body="probe" && echo ISSUE_WRITE_OK || echo ISSUE_WRITE_FAILED
